name: Haber Stüdyosu Görsel Render

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Bağımlılıkları Kur
        run: npm install

      - name: Chrome ile Stüdyoyu Çalıştır ve Görseli Üret
        run: node render.js
